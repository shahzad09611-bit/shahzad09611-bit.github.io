<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alan Turing Birthday Gift</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    body{
      background:#fffdf7;
      font-family:Georgia,'Times New Roman',serif;
      padding:18px;
      color:#071b3a;
    }

    .typing{
      text-align:center;
      font-size:clamp(28px,7vw,60px);
      color:#071b3a;
      margin:25px auto;
      white-space:nowrap;
      overflow:hidden;
      border-right:4px solid #071b3a;
      width:0;
      animation:typing 4s steps(32,end) forwards, blink .7s infinite;
    }

    @keyframes typing{to{width:100%}}
    @keyframes blink{50%{border-color:transparent}}

    .hero{
      width:100%;
      max-width:1150px;
      display:block;
      margin:20px auto 40px;
      border-radius:20px;
      box-shadow:0 18px 40px rgba(0,0,0,.25);
    }

    .boxes{
      max-width:1000px;
      margin:auto;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:22px;
    }

    .box{
      background:#071b3a;
      color:#d8b46a;
      text-decoration:none;
      padding:28px 38px;
      border-radius:20px;
      font-size:clamp(20px,4vw,30px);
      font-weight:bold;
      box-shadow:0 15px 35px rgba(7,27,58,.35);
      animation:float 3s ease-in-out infinite;
      transition:.3s;
      text-align:center;
    }

    .box:hover{transform:scale(1.06)}

    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-10px)}
    }

    @media(max-width:600px){
      .box{width:100%}
    }
  </style>
</head>

<body>

  <h1 class="typing">Alan Turing Birthday Gift</h1>

  <img class="hero" src="file_000000003f347208b2bfa655e26b424f.png" alt="Alan Turing">

  <div class="boxes">
    <a class="box" href="page1.html">Short Write-up</a>
    <a class="box" href="page2.html">Poster</a>
    <a class="box" href="page3.html">Quote Card</a>
  </div>

  <script>
    console.log("Alan Turing Birthday Gift Website Loaded");
  </script>

</body>
</html>
