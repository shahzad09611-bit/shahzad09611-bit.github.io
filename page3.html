<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote Card</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    body{
      background:#000;
      min-height:100vh;
      font-family:Georgia,'Times New Roman',serif;

      flex-direction:column;
      align-items:center;

    .quote{
      width:100%;
      max-width:100%;
      max-height:88vh;

      display:block;

    .back{
      margin-top:15px;
      padding:14px 38px;
      background:#071b3a;
      color:#fffdf7;
      text-decoration:none;
      border-radius:12px;
      font-size:22px;
      font-weight:bold;
    }
  </style>
